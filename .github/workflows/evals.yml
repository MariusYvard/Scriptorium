name: evals
on:
  push:
  pull_request:
jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Compiler les scripts
        run: python3 -m py_compile scriptorium/scripts/*.py tools/*.py scriptorium/hooks/scripts/*.py
      - name: Lancer le harnais d'evaluation
        run: python3 evals/run-evals.py
