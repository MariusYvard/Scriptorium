name: gabarits-latex

# Compile pour de vrai les deux gabarits LaTeX du plugin dans une image TeX
# Live. Avant ce job, seul l'equilibre de leurs environnements avait ete
# verifie par script : aucun gabarit n'etait jamais passe dans xelatex.
#
# Le declencheur est etroit a dessein : l'image TeX Live pese pres de 9 Go,
# la tirer a chaque push de branche coute plus qu'elle ne prouve. Le job
# tourne sur les chemins qui peuvent casser la compilation (les gabarits, la
# charte injectee, le generateur de preambule, le preparateur), sur main et
# sur toute pull request, et se declenche a la main au besoin.

on:
  push:
    branches: [main]
    paths:
      - 'scriptorium/assets/gabarit-*.tex'
      - 'scriptorium/assets/charte-graphique.exemple.json'
      - 'scriptorium/scripts/theme.py'
      - 'tools/ci-latex.py'
      - '.github/workflows/gabarits-latex.yml'
  pull_request:
    paths:
      - 'scriptorium/assets/gabarit-*.tex'
      - 'scriptorium/assets/charte-graphique.exemple.json'
      - 'scriptorium/scripts/theme.py'
      - 'tools/ci-latex.py'
      - '.github/workflows/gabarits-latex.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gabarits-latex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilation-latex:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Ecrire le script de compilation
        run: |
          mkdir -p "${{ runner.temp }}/latex"
          cat > "${{ runner.temp }}/latex/compiler.sh" <<'SH'
          set -u

          # Rechauffer le cache fontconfig AVANT toute chose. theme.py
          # interroge fc-list avec un delai de 10 s pour savoir si la police
          # demandee par la charte est installee ; sur un cache froid, fc-list
          # met une douzaine de secondes, theme.py conclut "disponibilite
          # inconnue" et emet la police demandee telle quelle. La charte
          # d'exemple demande Georgia, absente de TeX Live : le repli sur
          # Latin Modern n'a alors pas lieu et xelatex echoue. Cache chaud,
          # fc-list repond en 0,3 s et le repli joue.
          fc-list > /dev/null 2>&1 || true

          python3 /repo/tools/ci-latex.py preparer --dest /build || exit 1
          cd /build || exit 1

          echec=0
          for doc in gabarit-rapport gabarit-poster pilote-figure; do
            if latexmk -xelatex -bibtex- -halt-on-error \
                       -interaction=nonstopmode -file-line-error \
                       "$doc.tex" > "$doc.build.log" 2>&1; then
              echo "OK     $doc"
            else
              echo "ECHEC  $doc"
              tail -60 "$doc.build.log"
              echec=1
            fi
          done

          python3 /repo/tools/ci-latex.py controler --dest /build || echec=1
          exit $echec
          SH

      - name: Compiler les gabarits dans TeX Live
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/repo:ro" \
            -v "${{ runner.temp }}/latex:/build" \
            -w /repo texlive/texlive:latest \
            bash /build/compiler.sh
